plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jhuladudh.delivery'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jhuladudh.delivery'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "JhulaDudhDelivery-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.9.0'
}
